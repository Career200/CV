<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/binary-code.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dmitry Zhukov</title>
    <script>
      // iife to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("darkModeOn");
          var dark = stored
            ? JSON.parse(stored)
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.classList.toggle("dark-mode", dark);
        } catch (e) {}
      })();
    </script>
    <link
      href="https://fonts.googleapis.com/css2?family=Michroma&family=Orbitron:wght@500&family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
